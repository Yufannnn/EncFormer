name: EncFormer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Lint
        run: |
          pip install --quiet ruff
          ruff check src/ scripts/ tests/

      - name: Syntax
        run: |
          python - <<'PY'
          import ast, glob, sys
          bad = 0
          for f in glob.glob("scripts/*.py"):
              try:
                  ast.parse(open(f).read())
              except SyntaxError as e:
                  print(f"SYNTAX ERROR {f}: {e}"); bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Shell
        run: bash -n scripts/build.sh scripts/2pc.sh scripts/build_ezpc_sci.sh scripts/package.sh

      - name: Tests
        run: |
          pip install --quiet numpy pytest
          pytest -q tests

      - name: Package
        run: |
          for f in scripts/demo.py scripts/eval.py scripts/check.py \
                   Dockerfile requirements.txt CHECKSUMS.sha256 \
                   assets/EncFormer-Profile.png data/sst2-validation.jsonl \
                   data/bert-base-uncased/vocab.txt checkpoints/encformer-sst2/model.pt \
                   third_party/ezpc-sci/src/binding.cpp \
                   third_party/phantom-fhe/examples/pipe_tp_server.cu \
                   third_party/ezpc/SCI/src/FloatingPoint/fixed-point.cpp ; do
            test -f "$f" || { echo "MISSING tracked file: $f"; exit 1; }
          done
          bash scripts/package.sh dist
          unzip -tq dist/EncFormer-v2.0.0.zip
