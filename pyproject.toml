[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "encformer"
version = "1.0.0"
description = "Secure and Efficient Transformer Inference over Encrypted Data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "transformers>=4.30",
    "tqdm>=4.60",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
crypten = ["crypten>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — handled by formatter if desired
    "E402",  # module-import-not-at-top — needed for lazy/conditional imports
    "E702",  # multiple statements on one line — used in compact math
    "E731",  # lambda assignment — used for short callbacks
    "E741",  # ambiguous variable name (common in math-heavy code)
    "F401",  # unused imports — many are re-exported for callers
    "F541",  # f-string without placeholders — used for readability
    "F821",  # undefined name — false positives in conditional/native paths
    "F841",  # unused variable — many are debug/intermediate
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
